name: deploy

# main 에 합쳐질 때마다 테스트 → 빌드 → GitHub Pages 배포를 자동으로 한다.
# 배포 주소: https://namong118.github.io/aihand-care/
# 레포 Settings → Pages → Source 를 "GitHub Actions" 로 한 번 바꿔 두어야 동작한다.
on:
  push:
    branches: [main]
  workflow_dispatch: # Actions 탭에서 손으로 다시 배포할 때

permissions:
  contents: read
  pages: write
  id-token: write

# 배포가 겹치면 앞의 것을 기다렸다가 마지막 것만 배포한다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        # 보호자 폰 앱(guardian/)이 배포 주소에서 실제 기록을 읽게 Supabase 주소·공개 키를 넘긴다 (#62, docs/guardian-app.md 4번)
        # 값은 저장소 Settings → Secrets and variables → Actions → Variables 에 넣는다. 없으면 빈 값이라 지금처럼 Mock(#demo만)
        # VITE_STATION_KEY(스테이션 비밀값)는 넣지 않는다: 라즈베리파이 .env.local 에만. 그래서 배포 주소의 스테이션 앱은 계속 Mock
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
