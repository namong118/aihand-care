name: deploy

# main 에 합쳐질 때마다 테스트 → 빌드 → GitHub Pages 배포를 자동으로 한다.
# 배포 주소: https://namong118.github.io/aihand-care/
# 레포 Settings → Pages → Source 를 "GitHub Actions" 로 한 번 바꿔 두어야 동작한다.
on:
  push:
    branches: [main]
  workflow_dispatch: # Actions 탭에서 손으로 다시 배포할 때

permissions:
  contents: read
  pages: write
  id-token: write

# 배포가 겹치면 앞의 것을 기다렸다가 마지막 것만 배포한다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
