<title>STEP 3 색깔 카드 인쇄본</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  /*
   * STEP 3 색깔손 시연용 색깔 카드 4장 (A4 한 장, 2쪽은 양면 인쇄용 뒷면).
   * 인쇄: Chrome에서 이 파일 열기 → Ctrl+P → 용지 A4, 배율 100%(실제 크기), 여백 "없음", "배경 그래픽" 켜기.
   *   한 면만: 페이지 "1"만 인쇄. 양면: 양면 인쇄 "긴 쪽으로 넘기기".
   *   글꼴은 인터넷이 되면 Google Fonts(East Sea Dokdo, Gowun Dodum), 안 되면 맑은 고딕으로 나온다.
   *   카드 색 가장자리를 따라 자른다.
   * 색은 src/data/colors.json 의 화면 색과 같다. 프린터마다 색이 다르게 나올 수 있으니 실물로 확인한다.
   * 태그: AprilTag tag36h11, 빨강 0 · 파랑 1 · 노랑 2 · 초록 3 (#5 임시 결정, 종이 카드 테스트 후 확정).
   *   태그 그림은 공식 이미지(AprilRobotics/apriltag-imgs tag36h11)의 칸을 그대로 옮겼다.
   *   태그는 흰 판 안에 두고, 둘레 흰 여백을 자르거나 가리지 않는다.
   * 모양: 색 바탕 + 색 이름 + 흰 판(태그)만 둔다. 그림·질감·명언은 넣지 않는다 (인식이 또렷하고 어르신이 보기 쉽게, #104).
   */
  :root {
    --ink: #1f1b18;
    --ink-soft: #6b625b;
    --paper: #fff;
    --radius: 2mm;
    --red: #ff5a5a;
    --blue: #5aa8ff;
    --yellow: #ffd400;
    --green: #3ddc6a;
  }
  @page { size: A4; margin: 0; }
  * { box-sizing: border-box; }
  body { margin: 0; word-break: keep-all; font-family: "Gowun Dodum", "Malgun Gothic", sans-serif; background: var(--paper); color: var(--ink); }
  .sheet {
    width: 210mm; height: 297mm; padding: 10mm;
    display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 8mm;
    break-after: page;
  }
  .sheet:last-child { break-after: auto; }
  .card {
    position: relative; overflow: hidden; isolation: isolate;
    border-radius: var(--radius); padding: 7mm;
    display: flex; flex-direction: column; justify-content: space-between;
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }
  /* 색 이름: 붓으로 쓴 듯 크게, 살짝 기울여서 */
  .label {
    position: relative; z-index: 2;
    font-family: "East Sea Dokdo", "Malgun Gothic", sans-serif;
    font-size: 44mm; line-height: 0.9; transform: rotate(var(--tilt)); transform-origin: left center;
    margin-left: -1mm;
  }
  /* 흰 라벨: 태그 + 안내 */
  .panel {
    position: relative; z-index: 2;
    background: var(--paper); border-radius: 0.8mm; padding: 6mm 4mm 4mm;
    display: grid; grid-template-columns: auto 1fr; gap: 4mm;
    transform: rotate(-0.6deg);
  }
  .tag { display: block; width: 46mm; height: 46mm; }
  .side { display: flex; flex-direction: column; justify-content: space-between; padding: 1mm 0; }
  .meta { font-size: 2.8mm; line-height: 1.4; color: var(--ink-soft); }
  .hint { font-size: 4.8mm; font-weight: 700; line-height: 1.3; }
  .red { background: var(--red); }
  .blue { background: var(--blue); }
  .yellow { background: var(--yellow); }
  .green { background: var(--green); }
</style>
