<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>색깔 카드 인쇄본</title>
<style>
  /*
   * 색깔손·카드 섞기용 색깔 카드 4장 (A4 한 장, 한 면만 인쇄).
   * 모양: 정사각형 색 바탕 + 흰 판 안에 AprilTag + 아래에 작은 색 이름 (2026-11-27 A).
   * 인쇄: Chrome에서 이 파일 열기 → Ctrl+P → 용지 A4, 배율 100%(실제 크기), 여백 "없음", "배경 그래픽" 켜기.
   *   회색 점선을 따라 자른다. 뒷면은 없다 (태그가 있는 면을 카메라에 보여 준다).
   * 색은 인쇄에서 또렷하게 나오도록 진한 원색을 쓴다 (color-cards.html 과 같은 색, 화면 색 colors.json 보다 진함).
   *   프린터마다 색이 다르게 나올 수 있으니 실물로 확인한다.
   * 태그: AprilTag tag36h11, 빨강 0 · 파랑 1 · 노랑 2 · 초록 3 (src/core/card/tags.json).
   *   태그 그림은 공식 이미지(AprilRobotics/apriltag-imgs tag36h11)의 칸을 그대로 옮겼다.
   *   흰 판(태그 둘레 여백)을 자르거나 손가락으로 가리지 않는다. 카드는 색 테두리를 잡는다.
   */
  :root {
    --red: #e3121b;
    --blue: #0b4fd8;
    --yellow: #ffd200;
    --green: #1fa83a;
    --cut: #b9bec7;
  }
  @page { size: A4; margin: 0; }
  * { box-sizing: border-box; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  html, body { margin: 0; padding: 0; background: #fff; }
  /* 정사각형 90mm 카드 4장, A4 가운데 */
  .sheet {
    width: 210mm; height: 297mm;
    display: grid; grid-template-columns: 90mm 90mm; grid-auto-rows: 90mm;
    gap: 10mm; justify-content: center; align-content: center;
    break-after: page;
  }
  .sheet:last-child { break-after: auto; }
  .card {
    width: 90mm; height: 90mm; border-radius: 4mm;
    outline: 0.25mm dashed var(--cut); outline-offset: 1.5mm;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3mm;
    padding-top: 4mm;
  }
  /* 흰 판: 태그 + 둘레 여백 (태그 그림 자체에도 흰 테두리 한 칸이 있다) */
  .plate { width: 62mm; height: 62mm; background: #fff; border-radius: 2mm; display: grid; place-items: center; }
  .tag { display: block; width: 54mm; height: 54mm; }
  /* 색 이름: 아래에 작게 (흰 판 밖, 태그를 가리지 않게) */
  .name { font-family: "Malgun Gothic", "Noto Sans CJK KR", sans-serif; font-size: 6mm; font-weight: 700; line-height: 1; color: #fff; letter-spacing: 0.5mm; }
  .yellow .name { color: #1f1b18; }
  .red { background: var(--red); }
  .blue { background: var(--blue); }
  .yellow { background: var(--yellow); }
  .green { background: var(--green); }
  @media screen {
    body { background: #e9ebee; }
    .sheet { background: #fff; margin: 8mm auto; box-shadow: 0 1mm 4mm rgba(0,0,0,.15); }
  }
</style>
</head>
